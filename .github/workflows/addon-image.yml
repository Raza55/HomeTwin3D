# Prebuilt Home Assistant add-on images (see 3dash-addon/config.yaml `image:`).
# A release is a version bump in 3dash-addon/config.yaml on main: this builds
# ghcr.io/raza55/{amd64,aarch64}-addon-hometwin3d:<version> from that commit,
# and Home Assistant offers the update and only downloads the image.
name: Add-on images

on:
  push:
    branches: [main]
    paths: ['3dash-addon/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' 3dash-addon/config.yaml)" >> "$GITHUB_OUTPUT"
      # The web app is built natively (--platform=$BUILDPLATFORM); only the
      # small nginx stage runs emulated for arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: 3dash-addon
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REF=${{ github.sha }}
          labels: |
            io.hass.name=HomeTwin3D
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/Raza55/HomeTwin3D
          tags: |
            ghcr.io/raza55/${{ matrix.arch }}-addon-hometwin3d:${{ steps.version.outputs.version }}
            ghcr.io/raza55/${{ matrix.arch }}-addon-hometwin3d:latest
