# Write PIN for the shared installation, generated by run.sh from the add-on option.
map $http_x_hometwin_pin $hometwin_pin_ok {
    default 0;
    include /etc/nginx/hometwin-pin.map;
}

server {
    listen 8099;
    server_name _;
    root /var/www/html;
    index index.html;

    # Fixed HA upstream and media-player-only path; never an arbitrary URL proxy.
    # The request retains HA's image-scoped token; no admin token.
    location ~ ^/ha-media/(media_player\.[a-z0-9_]+)$ {
        resolver 127.0.0.11 valid=30s;
        set $ha_media_entity $1;
        proxy_pass http://homeassistant:8123/api/media_player_proxy/$ha_media_entity$is_args$args;
        proxy_set_header Host homeassistant:8123;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        access_log off;
        error_log /dev/null crit;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
    }

    location ~ ^/ha-camera/(camera\.[a-z0-9_]+)$ {
        resolver 127.0.0.11 valid=30s;
        set $ha_camera_entity $1;
        proxy_pass http://homeassistant:8123/api/camera_proxy/$ha_camera_entity$is_args$args;
        proxy_set_header Host homeassistant:8123;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        access_log off;
        error_log /dev/null crit;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
    }

    # Home Assistant WebSocket through this origin: a page served over HTTPS
    # (reverse proxy in front of the add-on) may not open ws:// to HA itself.
    # Fixed upstream; HA still authenticates every connection with its token.
    location = /ha-ws {
        resolver 127.0.0.11 valid=30s;
        set $ha_websocket http://homeassistant:8123/api/websocket;
        proxy_pass $ha_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host homeassistant:8123;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        access_log off;
    }

    # Shared installation (config, model, imported objects) for every browser in the LAN.
    # Everyone may read; PUT/DELETE need the write PIN. nginx writes via a temp file and
    # renames, so readers never see partial files.
    location = /shared/check-pin {
        add_header Cache-Control "no-store" always;
        if ($hometwin_pin_ok = 0) { return 403; }
        return 204;
    }

    location ~ ^/shared/(state\.json|model\.glb|objects/[A-Za-z0-9_-]{1,80}\.[a-z0-9]{1,8})$ {
        root /config;
        client_max_body_size 512m;
        client_body_temp_path /config/shared-tmp;
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw;
        add_header Cache-Control "no-cache" always;
        set $hometwin_write_pin "read";
        if ($request_method ~ ^(PUT|DELETE)$) { set $hometwin_write_pin $hometwin_pin_ok; }
        if ($hometwin_write_pin = 0) { return 403; }
        limit_except GET PUT DELETE { deny all; }
        access_log off;
    }

    location ~ ^/shared/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
