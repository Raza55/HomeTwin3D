server {
    listen 8099;
    server_name _;
    root /var/www/html;
    index index.html;

    # Fixed HA upstream and media-player-only path; never an arbitrary URL proxy.
    # The request retains HA's image-scoped token; no admin token.
    location ~ ^/ha-media/(media_player\.[a-z0-9_]+)$ {
        resolver 127.0.0.11 valid=30s;
        set $ha_media_entity $1;
        proxy_pass http://homeassistant:8123/api/media_player_proxy/$ha_media_entity$is_args$args;
        proxy_set_header Host homeassistant:8123;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        access_log off;
        error_log /dev/null crit;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
    }

    location ~ ^/ha-camera/(camera\.[a-z0-9_]+)$ {
        resolver 127.0.0.11 valid=30s;
        set $ha_camera_entity $1;
        proxy_pass http://homeassistant:8123/api/camera_proxy/$ha_camera_entity$is_args$args;
        proxy_set_header Host homeassistant:8123;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        access_log off;
        error_log /dev/null crit;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
